<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk - ON Shop</title>
    <!-- CSS Login & Toast Universal -->
    <link rel="stylesheet" href="../../assets/css/buyer-css/login.css" />
    <link rel="stylesheet" href="../../assets/css/buyer-css/toast.css" />
    <!-- Cloudflare Turnstile API -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            
            <!-- Tombol Kembali ke Beranda -->
            <div class="auth-top-bar">
                <a href="index.html" class="btn-back-home" title="Kembali ke Beranda">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>Beranda</span>
                </a>
            </div>

            <!-- Header Formulir -->
            <div class="auth-header">
                <a href="index.html" class="auth-logo-link">
                    <img
                        src="../../assets/Images/logo1.webp"
                        alt="ON Shop"
                        class="auth-logo-img"
                        onerror="this.onerror=null; this.src='../../assets/Images/logo.png';"
                    />
                </a>
                <h2>Masuk ke Akunmu</h2>
                <p>Silakan masuk untuk melanjutkan belanja.</p>
            </div>

            <!-- Form Login -->
            <form id="loginForm" class="auth-form" autocomplete="on">
                <div class="form-group">
                    <label for="username">Email / Nomor WhatsApp / Username</label>
                    <input
                        type="text"
                        id="username"
                        class="form-input"
                        placeholder="Contoh: user@email.com / 08xxxxxxxx"
                        required
                        autocomplete="username"
                    />
                </div>

                <div class="form-group">
                    <label for="password">Kata Sandi</label>
                    <div class="password-input-wrapper">
                        <input
                            type="password"
                            id="password"
                            class="form-input"
                            placeholder="Masukkan kata sandi"
                            required
                            autocomplete="current-password"
                        />
                        <button
                            type="button"
                            class="btn-toggle-password"
                            onclick="togglePasswordVisibility('password', this)"
                            title="Tampilkan Sandi"
                        >
                            <img
                                src="../../assets/Images/eye-closed.png"
                                alt="Tampilkan Sandi"
                                class="eye-icon"
                            />
                        </button>
                    </div>
                </div>

                <div class="form-row-options">
                    <a href="forgot-password.html" class="link-forgot-password">Lupa Password?</a>
                </div>

                <!-- Proteksi Bot Cloudflare Turnstile -->
                <div class="turnstile-container" style="margin-bottom: 16px; display: flex; justify-content: center; min-height: 65px;">
                    <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA" data-theme="light"></div>
                </div>

                <button type="submit" class="btn-auth-submit" id="btnLoginSubmit">
                    Masuk
                </button>
            </form>

            <div class="auth-footer">
                <span>Belum punya akun? </span>
                <a href="register.html" class="auth-switch-link">Daftar Sekarang</a>
            </div>

        </div>
    </div>

    <!-- Script Toast Universal & Login Logic -->
    <script src="../../assets/js/buyer-js/toast.js"></script>
    <script src="../../assets/js/buyer-js/login.js"></script>
</body>
</html>
