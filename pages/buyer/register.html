<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar Akun Baru - ON Shop</title>
    <!-- CSS Register & Toast Universal -->
    <link rel="stylesheet" href="../../assets/css/buyer-css/register.css" />
    <link rel="stylesheet" href="../../assets/css/buyer-css/toast.css" />
    <!-- Cloudflare Turnstile API -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            
            <!-- Tombol Kembali ke Beranda -->
            <div class="auth-top-bar">
                <a href="index.html" class="btn-back-home" title="Kembali ke Beranda">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>Beranda</span>
                </a>
            </div>

            <!-- Header Formulir -->
            <div class="auth-header">
                <a href="index.html" class="auth-logo-link">
                    <img
                        src="../../assets/Images/logo1.webp"
                        alt="ON Shop"
                        class="auth-logo-img"
                        onerror="this.onerror=null; this.src='../../assets/Images/logo.png';"
                    />
                </a>
                <h2>Daftar Akun Baru</h2>
                <p>Mulai pengalaman belanjamu sekarang.</p>
            </div>

            <!-- Form Registrasi -->
            <form id="registerForm" class="auth-form" autocomplete="on">
                <div class="form-group">
                    <label for="fullname">Nama Lengkap</label>
                    <input
                        type="text"
                        id="fullname"
                        class="form-input"
                        placeholder="Masukkan nama lengkap Anda"
                        required
                        autocomplete="name"
                    />
                </div>

                <div class="form-group">
                    <label for="regEmail">Email <span class="label-optional">(Boleh kosong jika isi No. HP)</span></label>
                    <input
                        type="email"
                        id="regEmail"
                        class="form-input"
                        placeholder="nama@email.com"
                        autocomplete="email"
                    />
                </div>

                <div class="form-group">
                    <label for="regPhone">Nomor WhatsApp / HP <span class="label-optional">(Boleh kosong jika isi Email)</span></label>
                    <input
                        type="tel"
                        id="regPhone"
                        class="form-input"
                        placeholder="Contoh: 08123456789"
                        autocomplete="tel"
                    />
                </div>

                <!-- Input Sandi -->
                <div class="form-group">
                    <label for="password">Kata Sandi</label>
                    <div class="password-input-wrapper">
                        <input
                            type="password"
                            id="password"
                            class="form-input"
                            placeholder="Buat kata sandi"
                            required
                            autocomplete="new-password"
                        />
                        <button
                            type="button"
                            class="btn-toggle-password"
                            onclick="togglePasswordVisibility('password', this)"
                            title="Tampilkan Sandi"
                        >
                            <img
                                src="../../assets/Images/eye-closed.png"
                                alt="Tampilkan Sandi"
                                class="eye-icon"
                            />
                        </button>
                    </div>
                </div>

                <!-- Konfirmasi Sandi -->
                <div class="form-group">
                    <label for="confirmPassword">Konfirmasi Kata Sandi</label>
                    <div class="password-input-wrapper">
                        <input
                            type="password"
                            id="confirmPassword"
                            class="form-input"
                            placeholder="Tulis ulang kata sandi Anda"
                            required
                            autocomplete="new-password"
                        />
                        <button
                            type="button"
                            class="btn-toggle-password"
                            onclick="togglePasswordVisibility('confirmPassword', this)"
                            title="Tampilkan Sandi"
                        >
                            <img
                                src="../../assets/Images/eye-closed.png"
                                alt="Tampilkan Sandi"
                                class="eye-icon"
                            />
                        </button>
                    </div>
                </div>

                <!-- Proteksi Bot Cloudflare Turnstile -->
                <div class="turnstile-container" style="margin-bottom: 16px; display: flex; justify-content: center; min-height: 65px;">
                    <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA" data-theme="light"></div>
                </div>

                <button type="submit" class="btn-auth-submit" id="btnRegSubmit">
                    Daftar Akun
                </button>
            </form>

            <div class="auth-footer">
                <span>Sudah punya akun? </span>
                <a href="login.html" class="auth-switch-link">Masuk di sini</a>
            </div>

        </div>
    </div>

    <!-- Script Toast Universal & Register Logic -->
    <script src="../../assets/js/buyer-js/toast.js"></script>
    <script src="../../assets/js/buyer-js/register.js"></script>
</body>
</html>
