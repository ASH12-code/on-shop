<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lupa Kata Sandi - ON Shop</title>
    <!-- CSS Login & Toast Universal -->
    <link rel="stylesheet" href="../../assets/css/buyer-css/login.css" />
    <link rel="stylesheet" href="../../assets/css/buyer-css/toast.css" />
    <!-- Cloudflare Turnstile API -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        .step-section {
            display: none;
        }
        .step-section.active {
            display: block;
        }
        .otp-input-large {
            font-size: 24px !important;
            letter-spacing: 8px !important;
            text-align: center !important;
            font-weight: 700 !important;
        }
        .channel-choice-card {
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }
        .channel-choice-card:hover {
            border-color: #10b981;
            background-color: #f0fdf4;
        }
        .channel-choice-card.selected {
            border-color: #10b981;
            background-color: #ecfdf5;
            box-shadow: 0 0 0 1px #10b981;
        }
        .channel-icon {
            font-size: 24px;
        }
        .channel-info strong {
            display: block;
            color: #1e293b;
            font-size: 14px;
        }
        .channel-info small {
            color: #64748b;
            font-size: 13px;
        }
        .resend-box {
            text-align: center;
            margin-top: 14px;
            font-size: 13px;
            color: #64748b;
        }
        .btn-link-resend {
            background: none;
            border: none;
            color: #10b981;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            text-decoration: underline;
        }
        .btn-link-resend:disabled {
            color: #94a3b8;
            cursor: not-allowed;
            text-decoration: none;
        }
        .demo-otp-banner {
            background: #eff6ff;
            border: 1px dashed #3b82f6;
            color: #1d4ed8;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            
            <!-- Tombol Kembali ke Halaman Login -->
            <div class="auth-top-bar">
                <a href="login.html" class="btn-back-home" title="Kembali ke Halaman Masuk">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>Masuk</span>
                </a>
            </div>

            <!-- Header Formulir -->
            <div class="auth-header">
                <a href="index.html" class="auth-logo-link">
                    <img
                        src="../../assets/Images/logo1.webp"
                        alt="ON Shop"
                        class="auth-logo-img"
                        onerror="this.onerror=null; this.src='../../assets/Images/logo.png';"
                    />
                </a>
                <h2 id="forgotHeaderTitle">Pemulihan Kata Sandi</h2>
                <p id="forgotHeaderDesc">Masukkan email atau nomor HP untuk menerima kode OTP.</p>
            </div>

            <!-- ========================================================= -->
            <!-- TAHAP 1: INPUT IDENTIFIER (EMAIL / NO TELP) + TURNSTILE -->
            <!-- ========================================================= -->
            <form id="step1Form" class="auth-form step-section active">
                <div class="form-group">
                    <label for="identifierInput">Email atau Nomor WhatsApp / HP</label>
                    <input
                        type="text"
                        id="identifierInput"
                        class="form-input"
                        placeholder="Contoh: user@email.com / 0812xxxxxxxx"
                        required
                        autocomplete="username"
                    />
                </div>

                <!-- Proteksi Bot Cloudflare Turnstile -->
                <div class="turnstile-container" style="margin-bottom: 16px; display: flex; justify-content: center; min-height: 65px;">
                    <div class="cf-turnstile" id="turnstileStep1" data-sitekey="1x00000000000000000000AA" data-theme="light"></div>
                </div>

                <button type="submit" class="btn-auth-submit" id="btnSubmitStep1">
                    Kirim Kode OTP
                </button>
            </form>

            <!-- ========================================================= -->
            <!-- TAHAP 2: PILIHAN CHANNEL PENGIRIMAN OTP (SKENARIO 1) -->
            <!-- ========================================================= -->
            <form id="step2Form" class="auth-form step-section">
                <p style="font-size: 13.5px; color: #475569; margin-bottom: 16px;">
                    Akun Anda memiliki 2 metode kontak terdaftar. Silakan pilih ke mana kode OTP ingin dikirim:
                </p>

                <div id="channelsContainer"></div>

                <button type="submit" class="btn-auth-submit" id="btnSubmitStep2" style="margin-top: 12px;">
                    Lanjut Kirim Kode OTP
                </button>
            </form>

            <!-- ========================================================= -->
            <!-- TAHAP 3: MASUKKAN 6 DIGIT KODE OTP -->
            <!-- ========================================================= -->
            <form id="step3Form" class="auth-form step-section">
                <div id="demoOtpBox" class="demo-otp-banner" style="display: none;"></div>

                <div class="form-group">
                    <label for="otpCodeInput" style="text-align: center; display: block;">Masukkan 6 Digit Kode OTP</label>
                    <input
                        type="text"
                        id="otpCodeInput"
                        class="form-input otp-input-large"
                        placeholder="••••••"
                        maxlength="6"
                        pattern="\d{6}"
                        required
                        autocomplete="one-time-code"
                    />
                </div>

                <button type="submit" class="btn-auth-submit" id="btnSubmitStep3">
                    Verifikasi Kode OTP
                </button>

                <div class="resend-box">
                    Belum menerima kode? 
                    <button type="button" class="btn-link-resend" id="btnResendOtp" disabled>
                        Kirim Ulang (<span id="resendCountdown">60</span>s)
                    </button>
                </div>
            </form>

            <!-- ========================================================= -->
            <!-- TAHAP 4: ATUR KATA SANDI BARU -->
            <!-- ========================================================= -->
            <form id="step4Form" class="auth-form step-section">
                <div class="form-group">
                    <label for="newPassword">Kata Sandi Baru</label>
                    <div class="password-input-wrapper">
                        <input
                            type="password"
                            id="newPassword"
                            class="form-input"
                            placeholder="Minimal 6 karakter"
                            required
                            autocomplete="new-password"
                        />
                        <button
                            type="button"
                            class="btn-toggle-password"
                            onclick="togglePasswordVisibility('newPassword', this)"
                            title="Tampilkan Sandi"
                        >
                            <img src="../../assets/Images/eye-closed.png" alt="Tampilkan Sandi" class="eye-icon" />
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmNewPassword">Konfirmasi Kata Sandi Baru</label>
                    <div class="password-input-wrapper">
                        <input
                            type="password"
                            id="confirmNewPassword"
                            class="form-input"
                            placeholder="Tulis ulang kata sandi baru"
                            required
                            autocomplete="new-password"
                        />
                        <button
                            type="button"
                            class="btn-toggle-password"
                            onclick="togglePasswordVisibility('confirmNewPassword', this)"
                            title="Tampilkan Sandi"
                        >
                            <img src="../../assets/Images/eye-closed.png" alt="Tampilkan Sandi" class="eye-icon" />
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-auth-submit" id="btnSubmitStep4">
                    Simpan Kata Sandi Baru
                </button>
            </form>

            <div class="auth-footer">
                <span>Ingat kata sandi Anda? </span>
                <a href="login.html" class="auth-switch-link">Masuk di sini</a>
            </div>

        </div>
    </div>

    <!-- Script Toast Universal & Forgot Password Logic -->
    <script src="../../assets/js/buyer-js/toast.js"></script>
    <script src="../../assets/js/buyer-js/forgot-password.js"></script>
</body>
</html>
